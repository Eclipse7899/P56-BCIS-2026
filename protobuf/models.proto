
syntax = "proto3";

package com.p56.safereach.v1;

option java_package = "com.p56.safereach.proto";
option java_multiple_files = true;

enum AlertType {
  EARTHQUAKE = 0;
  TSUNAMI = 1;
  FIRE = 2;
  FLOOD = 3;
}

enum Severity {
  LOW = 0;
  MEDIUM = 1;
  HIGH = 2;
}

message AlertDto {
  uint32 id = 1;

  uint64 timestamp = 2;

  string title = 3;
  string description = 4;

  AlertType type = 5;
  Severity severity = 6;

  sint32 latitude_e5 = 7;
  sint32 longitude_e5 = 8;

  uint32 radius_m = 9;

  uint32 expires_in_s = 10;
  bool invalidated = 11;
}

message AlertBatchDto {
  repeated AlertDto alerts = 1;
  uint64 timestamp = 2;
  uint32 expires_in_s = 3;
}

message SignedMessageDto {
  bytes data = 1;
  bytes signature = 2;
}
