name: Dev Branch Pull Request Check

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Add public key file
        env: PUBLIC_KEY: ${{ secrets.PublicKey }} 
        run: |
          mkdir -p app/src/main/res/raw 
          printf '%s\n' "$PUBLIC_KEY" > app/src/main/res/raw/public_key.pem

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check code with lint
        run: ./gradlew lint

      - name: Build with Gradle
        run: ./gradlew build

      - name: Run tests with Gradle
        run: ./gradlew test
